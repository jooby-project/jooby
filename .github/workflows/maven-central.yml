name: Maven Central

on:
  release:
    types: [created]

jobs:
  release:
    name: Release on Sonatype OSS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: maven
      - name: Setup gradle.properties
        env:
          GRADLE_PROPERTIES: ${{ secrets.GRADLE_PROPERTIES }}
        shell: bash
        run: |
          mkdir -p ~/.gradle/
          echo "GRADLE_USER_HOME=${HOME}/.gradle" >> $GITHUB_ENV
          echo "${GRADLE_PROPERTIES}" > ~/.gradle/gradle.properties
      - name: Build
        run: mvn clean install -DskipTests -q
      - name: Set up Maven Central
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'temurin'
          server-id: ossrh
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Publish to Maven Central
        run: mvn -pl '!tests' clean deploy -P bom,central,gradlePlugin
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

  update-release-notes:
    name: Update GitHub Release Notes
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: read # Required to fetch PR JSON data

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and Update Release Notes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG=${{ github.ref_name }}
          VERSION_NUM=${CURRENT_TAG#v}

          # Calculate previous tag using version sorting
          git fetch --tags --force
          PREV_TAG=$(git tag --sort=-v:refname | grep -A 1 "^${CURRENT_TAG}$" | tail -n 1)

          # Fetch milestone ID for the link
          MILESTONE_ID=$(gh api repos/${{ github.repository }}/milestones -q ".[] | select(.title==\"$VERSION_NUM\") | .number")

          # 1. Fetch BREAKING changes
          gh issue list \
            --repo ${{ github.repository }} \
            --search "milestone:\"$VERSION_NUM\" label:break-change" \
            --state all \
            --limit 100 \
            --json title,number \
            --jq '.[] | "- \(.title) #\(.number)"' > breaking_issues.md

          # 2. Fetch NEW features
          gh issue list \
            --repo ${{ github.repository }} \
            --search "milestone:\"$VERSION_NUM\" label:feature -label:break-change" \
            --state all \
            --limit 100 \
            --json title,number \
            --jq '.[] | "- \(.title) #\(.number)"' > new_issues.md

          # 3. Fetch DEPRECATED changes
          gh issue list \
            --repo ${{ github.repository }} \
            --search "milestone:\"$VERSION_NUM\" label:deprecated -label:break-change" \
            --state all \
            --limit 100 \
            --json title,number \
            --jq '.[] | "- \(.title) #\(.number)"' > deprecated_issues.md

          # 4. Fetch OTHER changes
          gh issue list \
            --repo ${{ github.repository }} \
            --search "milestone:\"$VERSION_NUM\" -label:feature -label:break-change -label:deprecated -label:dependencies" \
            --state all \
            --limit 100 \
            --json title,number \
            --jq '.[] | "- \(.title) #\(.number)"' > other_issues.md

          # 5. Fetch Component Summary (Group, Count, and Link Labels)
          gh issue list \
            --repo ${{ github.repository }} \
            --search "milestone:\"$VERSION_NUM\"" \
            --state all \
            --limit 1000 \
            --json number,labels \
            --jq '
              [ .[] as $issue | $issue.labels[].name |
              select(. != "bug" and . != "documentation" and . != "question" and . != "enhancement" and . != "feature" and . != "feedback" and . != "break-change" and . != "api-change" and . != "dependencies" and . != "deprecated") |
              {name: ., number: $issue.number} ] |
              group_by(.name) |
              map({
                name: .[0].name,
                count: length,
                issues: map("#\(.number)") | join(", ")
              }) |
              map(select(.count > 1)) |
              sort_by(-.count) |
              if length > 0 then
                "| Component | Count | Issues |\n|---|---|---|\n" + (map("| \(.name) | \(.count) | \(.issues) |") | join("\n"))
              else
                empty
              end
            ' > label_summary.md

          # 6. Fetch all issue numbers in this milestone to use as a filter
          CURRENT_ISSUES_JSON=$(gh issue list \
            --repo ${{ github.repository }} \
            --search "milestone:\"$VERSION_NUM\"" \
            --state all \
            --limit 1000 \
            --json number \
            --jq '[.[].number]')

          if [ -z "$CURRENT_ISSUES_JSON" ]; then
            CURRENT_ISSUES_JSON="[]"
          fi

          # 7. Fetch Pull Requests and filter out those that close CURRENT issues
          # Note: We dump to JSON first, then use a jq set-difference to check if the PR's closing issues overlap with the current milestone issues.
          gh pr list \
            --repo ${{ github.repository }} \
            --search "milestone:\"$VERSION_NUM\" is:merged -author:app/dependabot -label:dependencies" \
            --limit 100 \
            --json title,number,closingIssuesReferences > all_prs.json

          jq -r --argjson current_issues "$CURRENT_ISSUES_JSON" '
            .[] |
            select(
              ([.closingIssuesReferences[]?.number] - $current_issues | length) == ([.closingIssuesReferences[]?.number] | length)
            ) |
            "- \(.title) #\(.number)"
          ' all_prs.json > unlinked_prs.md

          # 8. Merge generic changes and standalone PRs into one file
          cat other_issues.md unlinked_prs.md > merged_changes.md

          # 9. Initialize the changelog file
          > changelog.md

          # 10. Conditionally add "Breaking Changes"
          if [ -s breaking_issues.md ]; then
            echo "## ⚠️ Breaking Changes" >> changelog.md
            echo "" >> changelog.md
            cat breaking_issues.md >> changelog.md
            echo "" >> changelog.md
          fi

          # 11. Conditionally add "What's New"
          if [ -s new_issues.md ]; then
            echo "## 🚀 What's New" >> changelog.md
            echo "" >> changelog.md
            cat new_issues.md >> changelog.md
            echo "" >> changelog.md
          fi

          # 12. Conditionally add "Changes & Pull Requests"
          if [ -s merged_changes.md ]; then
            echo "## 🛠️ Changes" >> changelog.md
            echo "" >> changelog.md
            cat merged_changes.md >> changelog.md
            echo "" >> changelog.md
          fi

          # 13. Conditionally add "Deprecated"
          if [ -s deprecated_issues.md ]; then
            echo "## 🗑️ Deprecated" >> changelog.md
            echo "" >> changelog.md
            cat deprecated_issues.md >> changelog.md
            echo "" >> changelog.md
          fi

          # 14. Conditionally add "Component Summary" Table inside a collapsible section
          if [ -s label_summary.md ]; then
            echo "## 📊 Component Updates" >> changelog.md
            echo "" >> changelog.md
            echo "<details>" >> changelog.md
            echo "<summary><strong>Click to expand component details</strong></summary>" >> changelog.md
            echo "" >> changelog.md
            cat label_summary.md >> changelog.md
            echo "" >> changelog.md
            echo "</details>" >> changelog.md
            echo "" >> changelog.md
          fi

          # 15. Build the rest of the changelog (Links & Resources only)
          cat << EOF >> changelog.md
          ## 🔗 Links & Resources
          - [$CURRENT_TAG](https://github.com/${{ github.repository }}/tree/$CURRENT_TAG)
          - [Closed Issues](https://github.com/${{ github.repository }}/milestone/$MILESTONE_ID?closed=1)
          - [Changelog](https://github.com/${{ github.repository }}/compare/$PREV_TAG...$CURRENT_TAG)
          - [Dependency Updates](https://github.com/${{ github.repository }}/pulls?q=is%3Apr+label%3Adependencies+is%3Aclosed+milestone%3A$VERSION_NUM)
          EOF

          # Overwrite the existing release notes
          gh release edit $CURRENT_TAG --notes-file changelog.md

      - name: Close Milestone
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_TAG=${{ github.ref_name }}
          VERSION_NUM=${CURRENT_TAG#v}

          # Fetch the ID of the milestone only if it is currently open
          MILESTONE_ID=$(gh api repos/${{ github.repository }}/milestones -q ".[] | select(.title==\"$VERSION_NUM\" and .state==\"open\") | .number")

          if [ -n "$MILESTONE_ID" ]; then
            echo "Closing milestone $VERSION_NUM (ID: $MILESTONE_ID)..."
            gh api \
              --method PATCH \
              -H "Accept: application/vnd.github+json" \
              repos/${{ github.repository }}/milestones/$MILESTONE_ID \
              -f state='closed'
            echo "Milestone closed successfully."
          else
            echo "No open milestone found matching version $VERSION_NUM. Skipping."
          fi
